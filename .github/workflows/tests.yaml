name: Tests

on:
  push:
    branches:
      - master
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          version: "0.28.0"
          caps-version: "0.1.1"

      - name: Install Calcit modules
        run: caps --ci --strict

      - name: Verify Snapshot and static gates
        run: |
          set -euo pipefail
          test -f calcit.cirru
          test -f deps.cirru
          test ! -e compact.cirru
          test ! -e package.cirru
          calcit calcit.cirru edit format
          git diff --exit-code -- calcit.cirru
          calcit calcit.cirru --check-only
          calcit calcit.cirru analyze quality --baseline config/calcit-quality.cirru
          calcit calcit.cirru analyze dynamic-methods --summary-only --format json | jq -e '.data.summary.findings == 0'
          calcit calcit.cirru analyze check-public --ns combinators.core --ns combinators.main --summary-only --format json

      - name: Run combinator laws
        run: calcit calcit.cirru test --require-match

      - name: Run example entry
        run: calcit calcit.cirru
